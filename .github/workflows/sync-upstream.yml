name: Sync upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ximeiorg/Xime.git
          # Keep upstream tags in a separate namespace so they cannot shadow
          # this fork's release tags.
          git fetch --no-tags --prune upstream main
          git fetch --no-tags --prune origin main
          git fetch --no-tags upstream '+refs/tags/*:refs/tags/upstream/*'

      - name: Sync main
        run: |
          set -euo pipefail

          echo "Fork-only commits before merge:"
          git log --oneline --decorate upstream/main..HEAD || true

          # Merge, never rebase: preserve existing fork commit SHAs and tags.
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            git merge --no-edit upstream/main
          else
            echo "Fork main already contains upstream main."
          fi

          echo "Fork-only commits after merge:"
          git log --oneline upstream/main..HEAD || true

          # Never force-update main.
          git push origin HEAD:main

      - name: Select release patches
        run: |
          set -euo pipefail

          # Only app-level patches should be applied to upstream release tags.
          # Workflow/CI maintenance commits stay on fork main.
          mapfile -t RELEASE_PATCHES < <(
            git log --format='%H%x09%s' upstream/main..HEAD |
            awk -F '\t' '$2 == "feat: add inline autofill suggestions toggle" { print $1 }' |
            tac
          )

          if [[ "${#RELEASE_PATCHES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one fork app patch for release tags; found ${#RELEASE_PATCHES[@]}."
            echo "Fork-only commits:"
            git log --oneline upstream/main..HEAD
            echo "If upstream has incorporated this feature, update the patch-selection logic instead of publishing an unpatched release."
            exit 1
          fi

          printf '%s\n' "${RELEASE_PATCHES[0]}" > /tmp/release-patches.txt
          echo "Selected release patch: ${RELEASE_PATCHES[0]}"

      - name: Sync new upstream release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE_TAG="v3.0.0"
          mapfile -t RELEASE_PATCHES < /tmp/release-patches.txt
          echo "Release patches to apply:"
          printf '  %s\n' "${RELEASE_PATCHES[@]}"

          mapfile -t UPSTREAM_TAGS < <(
            git for-each-ref \
              --sort='v:refname' \
              --format='%(refname:short)' \
              'refs/tags/upstream/v*'
          )

          for upstream_ref in "${UPSTREAM_TAGS[@]}"; do
            tag="${upstream_ref#upstream/}"

            # Sync stable semantic-version tags only.
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi

            # v3.0.0 is the immutable baseline and must never be recreated.
            if [[ "$(printf '%s\n' "$BASE_TAG" "$tag" | sort -V | head -n1)" == "$tag" ]]; then
              continue
            fi

            # Check the fork remote, not local refs: upstream tags are stored
            # under refs/tags/upstream/* and must not suppress fork tag creation.
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
            tag_check_status=$?
            set -e
            if [[ "$tag_check_status" -eq 0 ]]; then
              echo "Already exists on origin: $tag"
              continue
            elif [[ "$tag_check_status" -ne 2 ]]; then
              echo "::error::Could not check whether $tag exists on origin (git ls-remote exit $tag_check_status)"
              exit "$tag_check_status"
            fi

            echo "=== Syncing upstream release $tag ==="
            tmp_branch="sync-tag-${tag//./-}"

            # Always start from the exact upstream release tag.
            git switch --detach "refs/tags/upstream/$tag"
            git switch -C "$tmp_branch"

            for commit in "${RELEASE_PATCHES[@]}"; do
              git cherry-pick "$commit"
            done

            patched_sha="$(git rev-parse HEAD)"
            tag_message="$(git for-each-ref --format='%(contents:subject)%n%n%(contents:body)' "refs/tags/upstream/$tag")"
            if [[ -z "$tag_message" ]]; then
              tag_message="Xime $tag (upstream release + fork patches)"
            fi

            # Create and push the fork tag only after every patch applies.
            git tag -a "$tag" "$patched_sha" -m "$tag_message"
            git push origin "refs/tags/$tag"
            echo "Created $tag -> $patched_sha"

            # The fork's release workflow checks out this exact tag.
            # Dispatch failures must fail this run so the release is not silently skipped.
            gh workflow run release.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f release_tag="$tag"

            git switch main
            git branch -D "$tmp_branch"
          done

          echo "Upstream release tag sync completed."
